services:
  # 1. Backend Web Service (Node.js API + Real Inbound Mail Sync)
  - type: web
    name: tgmail-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: "*"
      - key: DOMAIN
        value: maxxspace.com
      - key: COOKIE_SECRET
        generateValue: true

  # 2. Frontend Web Service (Vite React UI)
  - type: web
    name: tgmail-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
